<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireHub Home</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="phone home-layout">
      <header class="home-header card soft">
        <h2 class="brand">Hire<span>Hub</span></h2>
        <div class="header-icons">
          <button class="ghost">💬</button>
          <button id="themeToggleBtn" class="ghost" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
          <button id="notificationsBtn" class="ghost notifications-btn" aria-label="Notifications" title="Notifications">🔔<span id="unreadBadge" class="unread-badge" hidden>0</span></button>
        </div>
        <div class="composer">
          <div class="avatar small"></div>
          <input id="postTriggerInput" readonly placeholder="What's on your mind?" />
        </div>
        <nav class="quick-actions">
          <button id="photoPostBtn">📷 Photo</button>
          <button id="videoPostBtn">🎥 Video</button>
          <button>💼 Job</button>
        </nav>
      </header>

      <section id="feed" class="feed">
        <!-- Posts will be injected here -->
      </section>

      <!-- Post Creation Modal -->
      <div id="postModal" class="modal">
        <div class="modal-header">
          <h3>Create a post</h3>
          <button id="closePostModal" class="close" style="color: var(--text); position: static;">✕</button>
        </div>
        <div class="modal-body">
          <div class="composer" style="border: 0;">
            <div class="avatar small profile-avatar-img"></div>
            <strong class="user-full-name">User Name</strong>
          </div>
          <textarea id="postModalInput" placeholder="What do you want to talk about?" rows="6" style="border: 0; outline: none; background: transparent; resize: none;"></textarea>

          <div id="mediaPreview" class="media-preview-container">
            <!-- Preview image or video will be injected here -->
            <button class="remove-media" id="removeMediaBtn">✕</button>
          </div>
        </div>
        <div class="modal-footer">
          <div class="modal-actions">
            <button id="modalPhotoBtn" title="Add a photo">📷</button>
            <button id="modalVideoBtn" title="Add a video">🎥</button>
            <input type="file" id="modalMediaInput" hidden accept="image/*,video/*" />
          </div>
          <button id="publishPostBtn" class="btn btn-primary small-btn">Post</button>
        </div>
      </div>

      <!-- Share Modal -->
      <div id="shareModal" class="modal">
        <div class="modal-header">
          <h3>Share Post</h3>
          <button id="closeShareModal" class="close" style="color: var(--text); position: static;">✕</button>
        </div>
        <div class="modal-body">
          <button id="copyLinkBtn" class="btn btn-secondary" style="width: 100%; text-align: left; margin-bottom: 12px;">🔗 Copy link to post</button>
          <p style="font-weight: 600; margin-bottom: 8px;">Share to a user</p>
          <div id="userListForSharing" class="user-list">
            <!-- Users will be injected here -->
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <button id="navHomeBtn">Home</button>
        <button id="navPostBtn">Post</button>
        <button>Inbox</button>
        <button id="profileBtn">Profile</button>
      </nav>

      <aside id="profilePanel" class="profile-panel" aria-hidden="true">
        <div class="panel-cover">
          <button id="coverUploadBtn" class="panel-camera" aria-label="Update cover photo">📷</button><input id="coverUploadInput" type="file" accept="image/*" hidden />
          <button id="closePanel" class="close">✕</button>
        </div>
        <div class="panel-body">
          <div class="panel-profile-top">
            <div id="profileAvatar" class="avatar profile"></div><input id="avatarUploadInput" type="file" accept="image/*" hidden />
            <button id="avatarUploadBtn" class="avatar-camera" aria-label="Update profile photo">📷</button>
          </div>

          <p class="panel-name-row">
            <strong id="panelName">Rohit Sharma</strong>
            <span class="pill" id="panelRole">Applicant</span>
          </p>
          <p id="panelHeadline">Product Designer at DesignX</p>
          <p id="panelLocation">Bengaluru, India</p>

          <div class="panel-section-head">
            <label>About Myself</label>
            <button class="edit-link" data-section="about">Edit</button>
          </div>
          <p id="aboutPreview" class="panel-preview"></p>
          <textarea id="aboutInput" class="edit-field" rows="4"></textarea>

          <div class="panel-section-head">
            <label>Headline</label>
            <button class="edit-link" data-section="headline">Edit</button>
          </div>
          <input id="headlineInput" class="edit-field" />

          <div class="panel-section-head">
            <label>Location</label>
            <button class="edit-link" data-section="location">Edit</button>
          </div>
          <input id="locationInput" class="edit-field" />

          <div class="panel-section-head">
            <label>Resume</label>
            <button class="edit-link">Edit</button>
          </div>
          <div class="resume-card">
            <span id="resumeName" class="resume-name">No resume uploaded</span>
            <span id="resumeMeta" class="resume-meta">Upload PDF</span>
            <a id="resumeDownload" class="resume-download" aria-label="Download resume" target="_blank" rel="noopener">⇩</a>
          </div>
          <div class="panel-item-row">
            <input id="resumeUrlInput" placeholder="Resume URL (optional)" />
            <input id="resumeUploadInput" type="file" accept="application/pdf" />
          </div>

          <div class="panel-section-head">
            <label>Experience</label>
          </div>
          <div class="panel-item-row">
            <input id="experienceInput" placeholder="Add experience" />
            <button id="addExperienceBtn" class="btn-secondary small-btn" type="button">Add</button>
          </div>
          <div id="experienceList" class="panel-list-empty">No experience added yet.</div>

          <div class="panel-section-head">
            <label>Education</label>
          </div>
          <div class="panel-item-row">
            <input id="educationInput" list="educationSuggestions" placeholder="Add education" />
            <datalist id="educationSuggestions"></datalist>
            <button id="addEducationBtn" class="btn-secondary small-btn" type="button">Add</button>
          </div>
          <div id="educationList" class="panel-list-empty">No education added yet.</div>

          <div class="panel-section-head">
            <label>Skills</label>
          </div>
          <div class="panel-item-row">
            <input id="skillsInput" list="skillsSuggestions" placeholder="Add skill" />
            <datalist id="skillsSuggestions"></datalist>
            <button id="addSkillsBtn" class="btn-secondary small-btn" type="button">Add</button>
          </div>
          <div id="skillsList" class="panel-list-empty">No skills added yet.</div>

          <div class="panel-section-head">
            <label>Edit My Posts</label>
          </div>
          <div id="profilePosts" class="panel-list-empty">No posts to edit.</div>

          <button id="saveProfile" class="btn btn-primary">Save Profile</button>
        </div>
      </aside>
      <div id="backdrop" class="backdrop"></div>
    </main>

    <script src="/js/home.js"></script>
    <script src="/js/profile-panel.js"></script>
    <script src="/js/profile-panel-smoke-check.js"></script>
  </body>
</html>
